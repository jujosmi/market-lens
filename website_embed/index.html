<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jujosmi Trade by Jujosmi Labs: equity market research, charts, company fundamentals, and market context.">
  <meta property="og:title" content="Jujosmi Trade | Jujosmi Labs">
  <meta property="og:description" content="Equity market research, charts, company fundamentals, and market context from Jujosmi Labs.">
  <meta name="theme-color" content="#0b1417">
  <title>Jujosmi Trade | Jujosmi Labs</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1417; color: #edf4f2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b1417; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    header { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 22px; border-bottom: 1px solid #26383a; }
    .brand { font-size: 16px; font-weight: 700; letter-spacing: .04em; }
    .brand span { color: #76e0b2; }
    .sub { color: #9eb0ad; font-size: 12px; }
    main { flex: 1; padding: 12px; }
    .embed { width: 100%; height: calc(100vh - 83px); min-height: 720px; overflow: hidden; border: 1px solid #26383a; border-radius: 14px; background: #0b1417; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 700px) { header { padding: 10px 14px; } main { padding: 6px; } .embed { height: 88vh; min-height: 680px; border-radius: 9px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">JUJOSMI <span>LABS</span> / JUJOSMI TRADE</div>
      <div class="sub">Stock market research &amp; monitoring</div>
    </header>
    <main>
      <div class="embed">
        <!-- Replace the placeholder below with your deployed Streamlit app URL. -->
        <iframe
          src="https://jjs-marketlens.streamlit.app/"
          title="Jujosmi Trade stock research dashboard"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="clipboard-write"
        ></iframe>
      </div>
    </main>
  </div>
</body>
</html>
