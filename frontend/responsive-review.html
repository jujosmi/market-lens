<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jujosmi Trade — Responsive Review</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background:#080c0b; color:#e8eeeb; font:13px/1.4 Inter,Segoe UI,sans-serif; }
      header { position:sticky; top:0; z-index:2; min-height:66px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 22px; border-bottom:1px solid #233029; background:#0c120f; }
      header strong { font-size:12px; letter-spacing:.12em; }
      header span { margin-left:10px; color:#819087; font-size:10px; }
      nav { display:flex; gap:6px; }
      button { border:1px solid #344139; border-radius:6px; padding:8px 11px; background:#111a15; color:#a9b9af; font:inherit; font-size:10px; cursor:pointer; }
      button[aria-pressed="true"] { border-color:#67c98f; background:#14251b; color:#b0ecc3; }
      button:focus-visible { outline:2px solid #73e3a7; outline-offset:2px; }
      main { min-height:calc(100vh - 66px); display:grid; place-items:start center; padding:20px; overflow:auto; }
      .frame { width:100%; display:grid; justify-items:center; gap:8px; }
      .frame-label { width:min(100%,1280px); color:#718078; font:9px Consolas,monospace; letter-spacing:.12em; }
      iframe { display:block; width:1280px; height:900px; max-width:none; border:1px solid #364239; border-radius:8px; background:#080c0b; box-shadow:0 24px 80px #0008; }
      @media(max-width:720px) { header { align-items:flex-start; flex-direction:column; } main { padding:12px 0; place-items:start; } .frame { justify-items:start; } .frame-label { padding-left:12px; } iframe { transform-origin:top left; } }
    </style>
  </head>
  <body>
    <header>
      <div><strong>JUJOSMI TRADE · RESPONSIVE REVIEW</strong><span>Local UI prototype only</span></div>
      <nav aria-label="Viewport presets">
        <button data-size="390,844" aria-pressed="true">Mobile · 390 × 844</button>
        <button data-size="768,1024" aria-pressed="false">Tablet · 768 × 1024</button>
        <button data-size="1280,900" aria-pressed="false">Desktop · 1280 × 900</button>
      </nav>
    </header>
    <main>
      <div class="frame">
        <div class="frame-label" id="frame-label">390 × 844 · APP VIEWPORT</div>
        <iframe id="prototype-frame" title="Jujosmi Trade prototype responsive viewport" src="/" width="390" height="844" style="width:390px;height:844px"></iframe>
      </div>
    </main>
    <script>
      const frame = document.getElementById("prototype-frame");
      const label = document.getElementById("frame-label");
      document.querySelectorAll("button[data-size]").forEach((button) => {
        button.addEventListener("click", () => {
          const [width, height] = button.dataset.size.split(",").map(Number);
          frame.width = String(width);
          frame.height = String(height);
          frame.style.width = `${width}px`;
          frame.style.height = `${height}px`;
          label.textContent = `${width} × ${height} · APP VIEWPORT`;
          document.querySelectorAll("button[data-size]").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        });
      });
    </script>
  </body>
</html>
