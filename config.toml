[theme]
base = "dark"
primaryColor = "#76e0b2"
showSidebarBorder = true

[theme.light]
primaryColor = "#087f63"
backgroundColor = "#f3f7f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#17312b"
borderColor = "#dce7e2"

[theme.light.sidebar]
backgroundColor = "#eaf1ee"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#76e0b2"
backgroundColor = "#0b1417"
secondaryBackgroundColor = "#111d20"
textColor = "#edf4f2"
borderColor = "#26383a"

[theme.dark.sidebar]
backgroundColor = "#0e191c"
secondaryBackgroundColor = "#111d20"

[server]
enableStaticServing = true
